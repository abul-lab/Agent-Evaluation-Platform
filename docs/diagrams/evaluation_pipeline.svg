<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background:#F8FAFC; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .box { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1.5; rx: 12px; }
      .layer-bg { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; rx: 16px; }
      .header-title { font-size: 20px; font-weight: 800; fill: #0F172A; }
      .header-sub { font-size: 13px; font-weight: 500; fill: #64748B; }
      .stage-title { font-size: 12px; font-weight: 700; fill: #475569; letter-spacing: 0.05em; text-transform: uppercase; }
      .card-title { font-size: 13px; font-weight: 700; fill: #0F172A; }
      .card-desc { font-size: 11px; font-weight: 500; fill: #64748B; }
      .arrow { stroke: #94A3B8; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-accent { stroke: #2563EB; stroke-width: 2.5; fill: none; stroke-linecap: round; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94A3B8" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Title Bar -->
  <g transform="translate(40, 30)">
    <rect width="40" height="40" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5" />
    <text x="20" y="25" text-anchor="middle" font-size="16" font-weight="900" fill="#2563EB">EP</text>
    <text x="56" y="22" class="header-title">Deterministic Evaluation Pipeline</text>
    <text x="56" y="38" class="header-sub">Parallel multi-domain evaluation with sub-millisecond execution and hard-gate verification</text>
  </g>

  <!-- Stage 1: Input Ingestion & Schema Validation -->
  <g transform="translate(40, 95)">
    <rect width="210" height="625" class="layer-bg" filter="url(#shadow)" />
    <text x="24" y="32" class="stage-title">1. Trace Intake</text>
    
    <g transform="translate(16, 50)">
      <rect width="178" height="95" class="box" />
      <rect x="12" y="12" width="6" height="6" rx="3" fill="#2563EB" />
      <text x="26" y="18" class="card-title">CATS Payload</text>
      <text x="12" y="38" class="card-desc">Canonical Agent Trace</text>
      <text x="12" y="54" class="card-desc">• Version 1.0.0 validated</text>
      <text x="12" y="70" class="card-desc">• Direct or OTEL translated</text>
      <rect x="12" y="80" width="70" height="8" rx="4" fill="#EFF6FF" />
    </g>

    <g transform="translate(16, 160)">
      <rect width="178" height="115" class="box" />
      <rect x="12" y="12" width="6" height="6" rx="3" fill="#059669" />
      <text x="26" y="18" class="card-title">Structural Validation</text>
      <text x="12" y="38" class="card-desc">• Pydantic V2 schema check</text>
      <text x="12" y="54" class="card-desc">• Step order monotonicity</text>
      <text x="12" y="70" class="card-desc">• Tool call resolution</text>
      <text x="12" y="86" class="card-desc">• Non-negative token counts</text>
      <rect x="12" y="98" width="100" height="8" rx="4" fill="#ECFDF5" />
    </g>

    <g transform="translate(16, 290)">
      <rect width="178" height="105" class="box" />
      <rect x="12" y="12" width="6" height="6" rx="3" fill="#D97706" />
      <text x="26" y="18" class="card-title">ExecutionContext</text>
      <text x="12" y="38" class="card-desc">• Memory-resident graph</text>
      <text x="12" y="54" class="card-desc">• Trajectory index builder</text>
      <text x="12" y="70" class="card-desc">• Token delta accountant</text>
      <rect x="12" y="84" width="85" height="8" rx="4" fill="#FEF3C7" />
    </g>

    <g transform="translate(16, 410)">
      <rect width="178" height="195" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="14" y="24" font-size="11" font-weight="700" fill="#475569">Intake Design Principles</text>
      <text x="14" y="48" font-size="11" font-weight="500" fill="#64748B">Zero IO in eval core</text>
      <text x="14" y="72" font-size="11" font-weight="500" fill="#64748B">Deterministic replay</text>
      <text x="14" y="96" font-size="11" font-weight="500" fill="#64748B">No external LLM calls</text>
      <text x="14" y="120" font-size="11" font-weight="500" fill="#64748B">O(N) single-pass pass</text>
      <rect x="14" y="145" width="150" height="35" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
      <text x="89" y="167" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">Throughput: measure locally</text>
    </g>
  </g>

  <!-- Connect Stage 1 -> 2 -->
  <path d="M 250 405 L 290 405" class="arrow-accent" marker-end="url(#arrowhead-blue)" />

  <!-- Stage 2: 7 Deterministic Evaluation Domains (Parallel) -->
  <g transform="translate(290, 95)">
    <rect width="530" height="625" class="layer-bg" filter="url(#shadow)" />
    <text x="24" y="32" class="stage-title">2. Seven Parallel Deterministic Evaluator Domains</text>
    <rect x="420" y="18" width="90" height="20" rx="10" fill="#EFF6FF" stroke="#BFDBFE" />
    <text x="465" y="32" text-anchor="middle" font-size="10" font-weight="700" fill="#2563EB">PARALLEL</text>

    <!-- Grid of 7 Domains -->
    <!-- Col 1 -->
    <g transform="translate(18, 50)">
      <rect width="240" height="130" class="box" />
      <rect x="12" y="12" width="22" height="22" rx="6" fill="#FEE2E2" />
      <text x="23" y="27" text-anchor="middle" font-size="12" font-weight="800" fill="#DC2626">1</text>
      <text x="42" y="24" class="card-title">Loop Detection</text>
      <text x="42" y="38" font-size="10" font-weight="600" fill="#DC2626">HARD GATE CRITICAL</text>
      <text x="12" y="60" class="card-desc">• Exact repetition hashing</text>
      <text x="12" y="76" class="card-desc">• Semantic oscillation patterns</text>
      <text x="12" y="92" class="card-desc">• Consecutive identical tool calls</text>
      <text x="12" y="108" class="card-desc">• Cyclic state machine detector</text>
    </g>

    <g transform="translate(18, 190)">
      <rect width="240" height="130" class="box" />
      <rect x="12" y="12" width="22" height="22" rx="6" fill="#EFF6FF" />
      <text x="23" y="27" text-anchor="middle" font-size="12" font-weight="800" fill="#2563EB">2</text>
      <text x="42" y="24" class="card-title">Tool Fidelity</text>
      <text x="42" y="38" font-size="10" font-weight="600" fill="#2563EB">SCHEMA INTEGRITY</text>
      <text x="12" y="60" class="card-desc">• Undeclared/hallucinated tools</text>
      <text x="12" y="76" class="card-desc">• JSON argument schema errors</text>
      <text x="12" y="92" class="card-desc">• Tool execution error handling</text>
      <text x="12" y="108" class="card-desc">• Invalid type coercion catch</text>
    </g>

    <g transform="translate(18, 330)">
      <rect width="240" height="130" class="box" />
      <rect x="12" y="12" width="22" height="22" rx="6" fill="#FEF3C7" />
      <text x="23" y="27" text-anchor="middle" font-size="12" font-weight="800" fill="#D97706">3</text>
      <text x="42" y="24" class="card-title">Safety & Policy</text>
      <text x="42" y="38" font-size="10" font-weight="600" fill="#D97706">HARD GATE CRITICAL</text>
      <text x="12" y="60" class="card-desc">• API keys / secrets leakage</text>
      <text x="12" y="76" class="card-desc">• Prompt injection markers</text>
      <text x="12" y="92" class="card-desc">• Jailbreak fingerprint match</text>
      <text x="12" y="108" class="card-desc">• PII / PCI compliance regex</text>
    </g>

    <g transform="translate(18, 470)">
      <rect width="240" height="135" class="box" />
      <rect x="12" y="12" width="22" height="22" rx="6" fill="#F3E8FF" />
      <text x="23" y="27" text-anchor="middle" font-size="12" font-weight="800" fill="#9333EA">4</text>
      <text x="42" y="24" class="card-title">Context & Budget</text>
      <text x="42" y="38" font-size="10" font-weight="600" fill="#9333EA">RESOURCE LIMITS</text>
      <text x="12" y="60" class="card-desc">• Context window saturation</text>
      <text x="12" y="76" class="card-desc">• Token consumption ceilings</text>
      <text x="12" y="92" class="card-desc">• Token bloat acceleration</text>
      <text x="12" y="108" class="card-desc">• Max step threshold enforcement</text>
    </g>

    <!-- Col 2 -->
    <g transform="translate(272, 50)">
      <rect width="240" height="130" class="box" />
      <rect x="12" y="12" width="22" height="22" rx="6" fill="#FEF3C7" />
      <text x="23" y="27" text-anchor="middle" font-size="12" font-weight="800" fill="#D97706">5</text>
      <text x="42" y="24" class="card-title">Latency & Cascades</text>
      <text x="42" y="38" font-size="10" font-weight="600" fill="#D97706">PERFORMANCE</text>
      <text x="12" y="60" class="card-desc">• Retry storm amplification</text>
      <text x="12" y="76" class="card-desc">• Step latency anomalies</text>
      <text x="12" y="92" class="card-desc">• Tool response bottleneck</text>
      <text x="12" y="108" class="card-desc">• Degraded subagent response</text>
    </g>

    <g transform="translate(272, 190)">
      <rect width="240" height="130" class="box" />
      <rect x="12" y="12" width="22" height="22" rx="6" fill="#ECFDF5" />
      <text x="23" y="27" text-anchor="middle" font-size="12" font-weight="800" fill="#059669">6</text>
      <text x="42" y="24" class="card-title">Goal Completion</text>
      <text x="42" y="38" font-size="10" font-weight="600" fill="#059669">TASK OUTCOME</text>
      <text x="12" y="60" class="card-desc">• Terminal state reached</text>
      <text x="12" y="76" class="card-desc">• Expected output criteria</text>
      <text x="12" y="92" class="card-desc">• Unfinished tasks flag</text>
      <text x="12" y="108" class="card-desc">• Output format conformity</text>
    </g>

    <g transform="translate(272, 330)">
      <rect width="240" height="130" class="box" />
      <rect x="12" y="12" width="22" height="22" rx="6" fill="#F0FDF4" />
      <text x="23" y="27" text-anchor="middle" font-size="12" font-weight="800" fill="#16A34A">7</text>
      <text x="42" y="24" class="card-title">Cost Accounting</text>
      <text x="42" y="38" font-size="10" font-weight="600" fill="#16A34A">FINANCIAL GOV</text>
      <text x="12" y="60" class="card-desc">• Dollar cost per execution</text>
      <text x="12" y="76" class="card-desc">• Multi-model tiered pricing</text>
      <text x="12" y="92" class="card-desc">• Dollar budget overrun guard</text>
      <text x="12" y="108" class="card-desc">• Unit economics allocation</text>
    </g>

    <g transform="translate(272, 470)">
      <rect width="240" height="135" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="14" y="24" font-size="11" font-weight="700" fill="#475569">Domain Output Contract</text>
      <text x="14" y="48" font-size="11" font-weight="500" fill="#64748B">• Normalized score: [0.00, 1.00]</text>
      <text x="14" y="68" font-size="11" font-weight="500" fill="#64748B">• Categorized findings list</text>
      <text x="14" y="88" font-size="11" font-weight="500" fill="#64748B">• Hard-gate failure triggers</text>
      <text x="14" y="108" font-size="11" font-weight="500" fill="#64748B">• Metric key-value dictionary</text>
    </g>
  </g>

  <!-- Connect Stage 2 -> 3 -->
  <path d="M 820 405 L 860 405" class="arrow-accent" marker-end="url(#arrowhead-blue)" />

  <!-- Stage 3: Scorecard Assembly & Output -->
  <g transform="translate(860, 95)">
    <rect width="300" height="625" class="layer-bg" filter="url(#shadow)" />
    <text x="24" y="32" class="stage-title">3. Scorecard & Findings</text>

    <g transform="translate(16, 50)">
      <rect width="268" height="110" class="box" />
      <text x="14" y="22" class="card-title">Weighted Aggregator</text>
      <text x="14" y="42" class="card-desc">• Configurable domain weights</text>
      <text x="14" y="58" class="card-desc">• Overall composite score [0-100]</text>
      <text x="14" y="74" class="card-desc">• Strict min-score clamping</text>
      <text x="14" y="92" class="card-desc">• Hard-gate veto override (Score → 0)</text>
    </g>

    <g transform="translate(16, 175)">
      <rect width="268" height="160" class="box" fill="#FFFFFF" />
      <text x="14" y="22" class="card-title">Scorecard Artifact</text>
      <rect x="14" y="34" width="75" height="20" rx="4" fill="#ECFDF5" stroke="#A7F3D0" />
      <text x="51" y="48" text-anchor="middle" font-size="10" font-weight="800" fill="#059669">VERDICT: PASS</text>
      <text x="14" y="74" font-size="11" font-weight="600" fill="#0F172A">Composite Score: 94.2 / 100</text>
      <text x="14" y="94" class="card-desc">• Loop Score: 1.00</text>
      <text x="14" y="110" class="card-desc">• Safety Score: 1.00</text>
      <text x="14" y="126" class="card-desc">• Tool Fidelity Score: 0.95</text>
      <text x="14" y="142" class="card-desc">• Cost: $0.0034 | Latency: 1.2s</text>
    </g>

    <g transform="translate(16, 350)">
      <rect width="268" height="120" class="box" />
      <text x="14" y="22" class="card-title">Finding Deduplication</text>
      <text x="14" y="42" class="card-desc">• Structured finding objects</text>
      <text x="14" y="58" class="card-desc">• Severity: CRITICAL | HIGH | MED</text>
      <text x="14" y="74" class="card-desc">• Step index reference & evidence</text>
      <text x="14" y="90" class="card-desc">• Actionable remediation steps</text>
    </g>

    <g transform="translate(16, 485)">
      <rect width="268" height="120" class="box" fill="#EFF6FF" stroke="#BFDBFE" />
      <text x="14" y="24" class="card-title" fill="#1E40AF">Downstream Consumers</text>
      <text x="14" y="48" font-size="11" font-weight="600" fill="#1E40AF">→ Governance Hard Gates</text>
      <text x="14" y="68" font-size="11" font-weight="600" fill="#1E40AF">→ Multi-channel Notifications</text>
      <text x="14" y="88" font-size="11" font-weight="600" fill="#1E40AF">→ CI/CD Release Blocker</text>
      <text x="14" y="108" font-size="11" font-weight="600" fill="#1E40AF">→ SQLite Storage</text>
    </g>
  </g>
</svg>
