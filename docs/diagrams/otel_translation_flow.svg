<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background:#F8FAFC; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .box { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1.5; rx: 12px; }
      .layer-bg { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; rx: 16px; }
      .header-title { font-size: 20px; font-weight: 800; fill: #0F172A; }
      .header-sub { font-size: 13px; font-weight: 500; fill: #64748B; }
      .stage-title { font-size: 12px; font-weight: 700; fill: #475569; letter-spacing: 0.05em; text-transform: uppercase; }
      .card-title { font-size: 13px; font-weight: 700; fill: #0F172A; }
      .card-desc { font-size: 11px; font-weight: 500; fill: #64748B; }
      .arrow { stroke: #94A3B8; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-accent { stroke: #2563EB; stroke-width: 2.5; fill: none; stroke-linecap: round; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94A3B8" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Title Bar -->
  <g transform="translate(40, 30)">
    <rect width="40" height="40" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5" />
    <text x="20" y="25" text-anchor="middle" font-size="16" font-weight="900" fill="#16A34A">OT</text>
    <text x="56" y="22" class="header-title">OpenTelemetry → CATS Translation Pipeline</text>
    <text x="56" y="38" class="header-sub">Native OTLP/HTTP &amp; gRPC trace ingestion without agent code modifications</text>
  </g>

  <!-- Stage 1: Frameworks & Emitters -->
  <g transform="translate(40, 95)">
    <rect width="210" height="625" class="layer-bg" filter="url(#shadow)" />
    <text x="24" y="32" class="stage-title">1. Agent Frameworks</text>

    <g transform="translate(16, 50)">
      <rect width="178" height="68" class="box" />
      <text x="14" y="22" class="card-title">LangGraph</text>
      <text x="14" y="40" class="card-desc">StateGraph &amp; Node spans</text>
      <text x="14" y="56" class="card-desc">langchain-core tracer</text>
    </g>

    <g transform="translate(16, 128)">
      <rect width="178" height="68" class="box" />
      <text x="14" y="22" class="card-title">CrewAI</text>
      <text x="14" y="40" class="card-desc">Agent &amp; Task spans</text>
      <text x="14" y="56" class="card-desc">OTEL span hooks</text>
    </g>

    <g transform="translate(16, 206)">
      <rect width="178" height="68" class="box" />
      <text x="14" y="22" class="card-title">AutoGen</text>
      <text x="14" y="40" class="card-desc">Multi-agent conversation</text>
      <text x="14" y="56" class="card-desc">ConversableAgent spans</text>
    </g>

    <g transform="translate(16, 284)">
      <rect width="178" height="68" class="box" />
      <text x="14" y="22" class="card-title">OpenAI Agents SDK</text>
      <text x="14" y="40" class="card-desc">Function calling traces</text>
      <text x="14" y="56" class="card-desc">Assistant run spans</text>
    </g>

    <g transform="translate(16, 362)">
      <rect width="178" height="68" class="box" />
      <text x="14" y="22" class="card-title">LlamaIndex</text>
      <text x="14" y="40" class="card-desc">Query engine &amp; Router</text>
      <text x="14" y="56" class="card-desc">OpenInference semantics</text>
    </g>

    <g transform="translate(16, 440)">
      <rect width="178" height="165" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="14" y="24" font-size="11" font-weight="700" fill="#475569">OTEL Exporter</text>
      <text x="14" y="46" font-size="11" font-weight="500" fill="#64748B">OTLP standard format</text>
      <text x="14" y="66" font-size="11" font-weight="500" fill="#64748B">gRPC / Protobuf</text>
      <text x="14" y="86" font-size="11" font-weight="500" fill="#64748B">HTTP / JSON</text>
      <text x="14" y="106" font-size="11" font-weight="500" fill="#64748B">Zero agent lock-in</text>
      <rect x="14" y="122" width="150" height="30" rx="4" fill="#ECFDF5" stroke="#A7F3D0" />
      <text x="89" y="141" text-anchor="middle" font-size="10" font-weight="700" fill="#059669">NO CODE CHANGES</text>
    </g>
  </g>

  <!-- Connect Stage 1 -> 2 -->
  <path d="M 250 405 L 290 405" class="arrow-accent" marker-end="url(#arrowhead-blue)" />

  <!-- Stage 2: Ingestion & Verification -->
  <g transform="translate(290, 95)">
    <rect width="250" height="625" class="layer-bg" filter="url(#shadow)" />
    <text x="24" y="32" class="stage-title">2. AEP Ingestion Gate</text>

    <g transform="translate(16, 50)">
      <rect width="218" height="110" class="box" />
      <text x="14" y="22" class="card-title">Collector Receiver</text>
      <rect x="14" y="32" width="105" height="18" rx="4" fill="#EFF6FF" />
      <text x="66" y="45" text-anchor="middle" font-size="9" font-weight="700" fill="#2563EB">/api/v1/otel/collector</text>
      <text x="14" y="68" class="card-desc">• Dual protocol listener</text>
      <text x="14" y="84" class="card-desc">• HTTP OTLP v1/traces</text>
      <text x="14" y="100" class="card-desc">• gRPC streaming channel</text>
    </g>

    <g transform="translate(16, 175)">
      <rect width="218" height="110" class="box" />
      <text x="14" y="22" class="card-title">Workspace Auth</text>
      <text x="14" y="42" class="card-desc">• Header: X-Workspace-Key</text>
      <text x="14" y="58" class="card-desc">• SHA-256 hashed verification</text>
      <text x="14" y="74" class="card-desc">• Scoped RBAC check (ENGINEER+)</text>
      <text x="14" y="90" class="card-desc">• Workspace tenant isolation</text>
    </g>

    <g transform="translate(16, 300)">
      <rect width="218" height="110" class="box" />
      <text x="14" y="22" class="card-title">Rate Limiter &amp; Buffer</text>
      <text x="14" y="42" class="card-desc">• 60-second sliding window</text>
      <text x="14" y="58" class="card-desc">• DoS spike protection</text>
      <text x="14" y="74" class="card-desc">• Batch unpacker &amp; memory queue</text>
      <text x="14" y="90" class="card-desc">• Payload size guard (max 10MB)</text>
    </g>

    <g transform="translate(16, 425)">
      <rect width="218" height="180" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="14" y="24" font-size="11" font-weight="700" fill="#475569">Ingestion Reliability</text>
      <text x="14" y="48" font-size="11" font-weight="500" fill="#64748B">Non-blocking trace stream</text>
      <text x="14" y="72" font-size="11" font-weight="500" fill="#64748B">Async queue persistence</text>
      <text x="14" y="96" font-size="11" font-weight="500" fill="#64748B">In-memory buffer with backpressure</text>
      <text x="14" y="120" font-size="11" font-weight="500" fill="#64748B">Idempotent trace keys</text>
      <rect x="14" y="138" width="190" height="30" rx="4" fill="#EFF6FF" stroke="#BFDBFE" />
      <text x="109" y="157" text-anchor="middle" font-size="11" font-weight="700" fill="#1D4ED8">&lt; 3ms Intake Latency</text>
    </g>
  </g>

  <!-- Connect Stage 2 -> 3 -->
  <path d="M 540 405 L 580 405" class="arrow-accent" marker-end="url(#arrowhead-blue)" />

  <!-- Stage 3: Semantic Translation Core -->
  <g transform="translate(580, 95)">
    <rect width="280" height="625" class="layer-bg" filter="url(#shadow)" />
    <text x="24" y="32" class="stage-title">3. Semantic Translation Core</text>

    <g transform="translate(16, 50)">
      <rect width="248" height="110" class="box" />
      <text x="14" y="22" class="card-title">Span Tree Reconstructor</text>
      <text x="14" y="42" class="card-desc">• SpanId / ParentSpanId graph</text>
      <text x="14" y="58" class="card-desc">• Chronological step ordering</text>
      <text x="14" y="74" class="card-desc">• Nested tool call resolution</text>
      <text x="14" y="90" class="card-desc">• Agent boundary grouping</text>
    </g>

    <g transform="translate(16, 175)">
      <rect width="248" height="125" class="box" />
      <text x="14" y="22" class="card-title">Semantic Convention Normalizer</text>
      <text x="14" y="42" class="card-desc">• Maps OpenInference &amp; GenAI conventions</text>
      <text x="14" y="58" class="card-desc">• Extract gen_ai.prompt → input</text>
      <text x="14" y="74" class="card-desc">• Extract gen_ai.completion → output</text>
      <text x="14" y="90" class="card-desc">• Extract tool.name &amp; arguments</text>
      <text x="14" y="106" class="card-desc">• Resolve error status &amp; stack traces</text>
    </g>

    <g transform="translate(16, 315)">
      <rect width="248" height="110" class="box" />
      <text x="14" y="22" class="card-title">Token &amp; Latency Normalizer</text>
      <text x="14" y="42" class="card-desc">• gen_ai.usage.prompt_tokens</text>
      <text x="14" y="58" class="card-desc">• gen_ai.usage.completion_tokens</text>
      <text x="14" y="74" class="card-desc">• Delta time computation (ms)</text>
      <text x="14" y="90" class="card-desc">• Cost calculation per model tier</text>
    </g>

    <g transform="translate(16, 440)">
      <rect width="248" height="165" rx="8" fill="#EFF6FF" stroke="#BFDBFE" />
      <text x="14" y="24" font-size="11" font-weight="700" fill="#1E40AF">Schema Mapping Logic</text>
      <text x="14" y="48" font-size="11" font-weight="500" fill="#1E3A8A">• SpanKind.INTERNAL → Workflow Step</text>
      <text x="14" y="70" font-size="11" font-weight="500" fill="#1E3A8A">• SpanKind.CLIENT → LLM / Tool Call</text>
      <text x="14" y="92" font-size="11" font-weight="500" fill="#1E3A8A">• Span Status.ERROR → Step Failure</text>
      <text x="14" y="114" font-size="11" font-weight="500" fill="#1E3A8A">• Root Span → Session / Target Run</text>
      <text x="14" y="136" font-size="11" font-weight="500" fill="#1E3A8A">• Span Attributes → Step Metadata</text>
    </g>
  </g>

  <!-- Connect Stage 3 -> 4 -->
  <path d="M 860 405 L 900 405" class="arrow-accent" marker-end="url(#arrowhead-blue)" />

  <!-- Stage 4: CATS Output & Evaluation -->
  <g transform="translate(900, 95)">
    <rect width="260" height="625" class="layer-bg" filter="url(#shadow)" />
    <text x="24" y="32" class="stage-title">4. CATS Canonical Output</text>

    <g transform="translate(16, 50)">
      <rect width="228" height="180" class="box" fill="#FFFFFF" />
      <text x="14" y="22" class="card-title">Canonical Agent Trace</text>
      <rect x="14" y="34" width="70" height="18" rx="4" fill="#ECFDF5" />
      <text x="49" y="46" text-anchor="middle" font-size="9" font-weight="800" fill="#059669">CATS v1.0.0</text>
      <text x="14" y="72" class="card-desc">• trace_id (UUID)</text>
      <text x="14" y="88" class="card-desc">• agent_name &amp; session_id</text>
      <text x="14" y="104" class="card-desc">• steps: List[StepRecord]</text>
      <text x="14" y="120" class="card-desc">• tool_calls: List[ToolCall]</text>
      <text x="14" y="136" class="card-desc">• total_tokens &amp; cost_usd</text>
      <text x="14" y="152" class="card-desc">• duration_ms &amp; timestamps</text>
    </g>

    <g transform="translate(16, 245)">
      <rect width="228" height="145" class="box" />
      <text x="14" y="22" class="card-title">AEP Core Ingestion</text>
      <text x="14" y="44" class="card-desc">• Stored in SQLModel (TraceRecord)</text>
      <text x="14" y="62" class="card-desc">• Available in Traces UI &amp; Explorer</text>
      <text x="14" y="80" class="card-desc">• Tagged with source framework</text>
      <text x="14" y="98" class="card-desc">• Immediate evaluation trigger</text>
      <text x="14" y="116" class="card-desc">• Historical benchmark index</text>
    </g>

    <g transform="translate(16, 405)">
      <rect width="228" height="200" class="box" fill="#F0FDF4" stroke="#BBF7D0" />
      <text x="14" y="24" class="card-title" fill="#166534">Design Alignment</text>
      <text x="14" y="48" font-size="11" font-weight="600" fill="#166534">✓ Evaluators stay unchanged</text>
      <text x="14" y="72" font-size="11" font-weight="600" fill="#166534">✓ Scorecards remain identical</text>
      <text x="14" y="96" font-size="11" font-weight="600" fill="#166534">✓ Governance policies align</text>
      <text x="14" y="120" font-size="11" font-weight="600" fill="#166534">✓ 100% Deterministic replay</text>
      <text x="14" y="144" font-size="11" font-weight="600" fill="#166534">✓ Full multi-tenancy auth</text>
      <text x="14" y="168" font-size="11" font-weight="600" fill="#166534">✓ Sub-second pipeline</text>
    </g>
  </g>
</svg>
