services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - ALLOW_ANONYMOUS_VIEWER=false
      # Set to the exact origin(s) the browser loads the frontend from.
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      - DATABASE_URL=sqlite:////app/data/agent_eval.db
      - PROJECT_NAME=Agent Evaluation Platform
    volumes:
      - aep_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  aep_data:
    driver: local
