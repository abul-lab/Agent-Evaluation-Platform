name: 💡 Feature Request / Improvement Proposal
description: Suggest an idea or enhancement for the Agent Evaluation Platform.
title: "[FEATURE]: "
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome proposals for enhancing AEP! Note that AEP adheres to a strict "Determinism First" architectural principle.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What challenge or gap does this proposal address?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution & Architectural Impact
      description: Describe your proposed solution, API endpoints, schema modifications, or UI workflows.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Capability Area
      options:
        - New Deterministic Evaluator Rule
        - Ingestion Adapter (LangGraph, CrewAI, AutoGen, LlamaIndex)
        - Analytics & Charting Visualization
        - Release Policy & CI/CD Gating
        - Enterprise RBAC & Multi-Tenancy
        - Developer Tooling & SDK
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative implementations or workarounds you've explored.

