name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

jobs:
  backend-checks:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Audit Python dependencies for known vulnerabilities
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Type check with MyPy
        run: python -m mypy app tests

      - name: Run Pytest with Coverage
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=85

  frontend-checks:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Audit Node dependencies for known vulnerabilities
        run: npm audit --audit-level=high

      - name: Type check TypeScript
        run: npm run typecheck

      - name: Lint Next.js
        run: npm run lint

      - name: Build Next.js Application
        run: npm run build

